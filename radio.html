<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>TETHYS TRANSMISSION RADIO</title>
  <style>
    /* Reset & Base */
    html, body { margin: 0; padding: 0; background: #040609; color: #5ce1e6; font-family: monospace; height: 100vh; overflow: hidden; user-select: none; }
    
    .radio-wrapper {
      display: flex; align-items: center; justify-content: center;
      height: 100vh; width: 100vw; padding: 10px; box-sizing: border-box;
    }

    /* Khung chứa chính tối ưu hóa không gian */
    .radio-container { 
      display: flex; flex-direction: column; justify-content: space-between;
      width: 100%; max-width: 400px; height: 145px;
      background: #040609; padding: 12px 15px; box-sizing: border-box; 
      border: 1px solid rgba(92, 225, 230, 0.3); border-left: 4px solid #5ce1e6;
      box-shadow: 0 0 20px rgba(0, 0, 0, 0.8);
    }
    
    /* 1. HEADER: Tiêu đề & Sóng âm */
    .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px dashed rgba(92, 225, 230, 0.3); padding-bottom: 6px; }
    .title-box { display: flex; flex-direction: column; overflow: hidden; padding-right: 10px; }
    .title { font-size: 13px; font-weight: bold; color: #fff; margin-bottom: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .subtitle { font-size: 9px; opacity: 0.7; letter-spacing: 1px; text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    
    .spectrum-box { display: flex; align-items: flex-end; gap: 2px; height: 15px; width: 30px; flex-shrink: 0; }
    .bar { width: 3px; background: #5ce1e6; height: 2px; border-radius: 1px; transition: height 0.1s; }
    .spectrum-box.playing .bar:nth-child(1) { animation: bounce 0.6s infinite alternate; }
    .spectrum-box.playing .bar:nth-child(2) { animation: bounce 0.4s infinite alternate 0.2s; }
    .spectrum-box.playing .bar:nth-child(3) { animation: bounce 0.7s infinite alternate 0.1s; }
    .spectrum-box.playing .bar:nth-child(4) { animation: bounce 0.5s infinite alternate 0.3s; }
    .spectrum-box.playing .bar:nth-child(5) { animation: bounce 0.8s infinite alternate 0.15s; }
    @keyframes bounce { 0% { height: 2px; } 100% { height: 15px; } }

    /* 2. MIDDLE CONTROLS: Nút điều khiển đặt ở giữa */
    .controls-row { display: flex; justify-content: center; align-items: center; gap: 15px; }
    
    .skip-btn { background: none; border: 1px solid rgba(92, 225, 230, 0.3); color: #5ce1e6; width: 26px; height: 26px; border-radius: 4px; font-size: 10px; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: 0.2s; padding: 0; }
    .skip-btn:hover { background: rgba(92, 225, 230, 0.1); border-color: #5ce1e6; }
    .skip-btn:active { transform: scale(0.9); }
    
    .play-btn { background: #5ce1e6; color: #040609; border: none; width: 36px; height: 36px; border-radius: 50%; font-size: 14px; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: 0.1s; padding: 0; }
    .play-btn .icon-play { margin-left: 3px; }
    .play-btn .icon-pause { display: none; }
    .play-btn.playing .icon-play { display: none; }
    .play-btn.playing .icon-pause { display: block; margin-left: 0; }
    .play-btn:active { transform: scale(0.9); }

    /* 3. PROGRESS ROW: Thanh tiến trình kéo dài tuyệt đối */
    .progress-container { display: flex; flex-direction: column; gap: 2px; width: 100%; }
    .time-labels { display: flex; justify-content: space-between; font-size: 9px; color: #888; }
    
    .seek-slider {
      -webkit-appearance: none; width: 100%; height: 4px;
      background: #333; border-radius: 2px; outline: none; cursor: pointer; margin: 0;
    }
    .seek-slider::-webkit-slider-thumb {
      -webkit-appearance: none; appearance: none;
      width: 10px; height: 10px; border-radius: 50%;
      background: #5ce1e6; cursor: pointer; box-shadow: 0 0 6px rgba(92, 225, 230, 0.8);
    }

    /* Ẩn Iframe Youtube */
    #hidden-player { position: absolute; left: -9999px; top: -9999px; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
  </style>
</head>
<body>
  
  <div class="radio-wrapper">
    <div class="radio-container">
      
      <!-- HEADER -->
      <div class="header">
        <div class="title-box">
          <div class="title">THO Transmission</div>
          <div class="subtitle">> AUDIO_SRC: THO PLAYLIST</div>
        </div>
        <div id="spectrum" class="spectrum-box">
          <div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div>
        </div>
      </div>

      <!-- CONTROLS ROW -->
      <div class="controls-row">
        <button id="prev-btn" class="skip-btn" title="Bài trước">⏮</button>
        <button id="play-btn" class="play-btn" title="Play/Pause">
          <span class="icon-play">▶</span>
          <span class="icon-pause">⏸</span>
        </button>
        <button id="next-btn" class="skip-btn" title="Bài tiếp theo">⏭</button>
      </div>

      <!-- PROGRESS ROW -->
      <div class="progress-container">
        <div class="time-labels">
          <span id="current-time">0:00</span>
          <span id="total-time">0:00</span>
        </div>
        <input type="range" id="seek-slider" class="seek-slider" value="0" min="0" max="100" step="1">
      </div>

    </div>
  </div>

  <div id="hidden-player"></div>

  <!-- SCRIPT API -->
  <script src="https://www.youtube.com/iframe_api"></script>
  <script>
    var ytPlayer, progressInterval;
    var isPlaying = false, isDragging = false;
    var playBtn = document.getElementById('play-btn');
    var seekSlider = document.getElementById('seek-slider');
    var currentTimeDisplay = document.getElementById('current-time');
    var totalTimeDisplay = document.getElementById('total-time');
    var spectrum = document.getElementById('spectrum');

    function formatTime(time) {
      if (isNaN(time)) return "0:00";
      var m = Math.floor(time / 60), s = Math.floor(time % 60);
      return m + ":" + (s < 10 ? "0" : "") + s;
    }

    function updateSliderColor() {
      var pct = (seekSlider.value / seekSlider.max) * 100;
      seekSlider.style.background = 'linear-gradient(to right, #5ce1e6 ' + pct + '%, #333 ' + pct + '%)';
    }

    function onYouTubeIframeAPIReady() {
      ytPlayer = new YT.Player('hidden-player', {
        height: '1', width: '1',
        playerVars: { 
          'autoplay': 1, 
          'controls': 0, 
          'playsinline': 1,
          'listType': 'playlist',
          'list': 'PLDAIHOJ8ZsPo'
        },
        events: {
          'onReady': function() {
            var duration = ytPlayer.getDuration();
            seekSlider.max = duration;
            totalTimeDisplay.innerText = formatTime(duration);
            ytPlayer.playVideo();
          },
          'onStateChange': function(e) {
            if (e.data == YT.PlayerState.PLAYING) {
              isPlaying = true;
              playBtn.classList.add('playing');
              spectrum.classList.add('playing');
              progressInterval = setInterval(function() {
                if (!isDragging && ytPlayer && ytPlayer.getCurrentTime) {
                  var current = ytPlayer.getCurrentTime();
                  seekSlider.value = current;
                  currentTimeDisplay.innerText = formatTime(current);
                  updateSliderColor();
                  
                  var duration = ytPlayer.getDuration();
                  if (seekSlider.max != duration) {
                    seekSlider.max = duration;
                    totalTimeDisplay.innerText = formatTime(duration);
                  }
                }
              }, 1000);
            } else {
              isPlaying = false;
              playBtn.classList.remove('playing');
              spectrum.classList.remove('playing');
              clearInterval(progressInterval);
            }
          }
        }
      });
    }

    playBtn.addEventListener('click', function() {
      if (ytPlayer && ytPlayer.playVideo) {
        isPlaying ? ytPlayer.pauseVideo() : ytPlayer.playVideo();
      }
    });

    document.getElementById('next-btn').addEventListener('click', function() {
      if (ytPlayer && typeof ytPlayer.nextVideo === 'function') ytPlayer.nextVideo();
    });

    document.getElementById('prev-btn').addEventListener('click', function() {
      if (ytPlayer && typeof ytPlayer.previousVideo === 'function') ytPlayer.previousVideo();
    });

    seekSlider.addEventListener('input', function() {
      isDragging = true;
      currentTimeDisplay.innerText = formatTime(this.value);
      updateSliderColor();
    });
    
    seekSlider.addEventListener('change', function() {
      if (ytPlayer && ytPlayer.seekTo) ytPlayer.seekTo(this.value, true);
      isDragging = false;
    });
  </script>
</body>
</html>
